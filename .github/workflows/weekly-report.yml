name: Weekly report

# Mondays 07:00 Sydney time. GitHub cron runs in UTC, so both 20:00 and 21:00
# UTC on Sunday are scheduled and the job continues only for the one that is
# 07:00 in Sydney (AEDT or AEST).
on:
  schedule:
    - cron: '0 20 * * 0'
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.PRODUCTION_URL || 'https://glideslope-d65.pages.dev' }}
      LAUNCH_DATE: ${{ vars.LAUNCH_DATE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WEB_ANALYTICS_SITE_TAG: ${{ secrets.CF_WEB_ANALYTICS_SITE_TAG }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
    steps:
      - name: Is it 07:00 on Monday in Sydney?
        id: when
        run: |
          now=$(TZ=Australia/Sydney date +%u-%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$now" = "1-07" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Sydney time is $now; the other schedule will run the report."; fi
      - if: steps.when.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.when.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.when.outputs.go == 'true'
        run: npm ci
      - name: Lighthouse against production (each template)
        if: steps.when.outputs.go == 'true'
        continue-on-error: true
        run: |
          npx playwright install chromium
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export LHCI_BASE="$SITE_URL"
          if curl -fsS "$SITE_URL/sitemap.xml" | grep -q '/insights/'; then export LHCI_BASE_PUBLISHED="$SITE_URL"; else export LHCI_SKIP_PUBLISHED=1; fi
          npx lhci collect --config=lighthouserc.cjs
          node scripts/lighthouse-summary.mjs .lighthouseci lighthouse-summary.md || true
      - name: Build and send the report
        if: steps.when.outputs.go == 'true'
        run: node scripts/ops/weekly-report.mjs lighthouse-summary.md
