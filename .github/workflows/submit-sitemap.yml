name: Submit sitemap

# Run by hand (Actions → Submit sitemap → Run workflow) to resubmit the live
# sitemap to Google Search Console. Deploys also resubmit it automatically
# whenever the list of pages changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.PRODUCTION_URL || 'https://glideslope-d65.pages.dev' }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit to Search Console
        run: node scripts/ops/gsc-submit.mjs --force
